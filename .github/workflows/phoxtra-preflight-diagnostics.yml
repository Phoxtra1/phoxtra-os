name: Phoxtra preflight diagnostics

on:
  push:
    branches: ["fix/**"]

permissions:
  contents: read
  statuses: write

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Storage safety audit
        id: storage_safety
        continue-on-error: true
        run: python3 scripts/check_storage_safety.py
      - name: Partition regression test
        id: partition_test
        continue-on-error: true
        run: |
          cc -std=gnu17 -Wall -Wextra -Werror tests/test_partition_validation.c kernel/storage/partition.c kernel/storage/blockdev.c -o /tmp/test_partition_validation
          /tmp/test_partition_validation
      - name: Ext2 regression test
        id: ext2_test
        continue-on-error: true
        run: |
          cc -std=gnu17 -Wall -Wextra -Werror tests/test_ext2_readonly.c kernel/storage/ext2.c kernel/vfs/vfs.c kernel/storage/blockdev.c -o /tmp/test_ext2_readonly
          /tmp/test_ext2_readonly
      - name: Storage journal regression test
        id: journal_test
        continue-on-error: true
        run: |
          cc -std=c11 -Wall -Wextra -Werror tests/test_storage_journal.c kernel/storage/storage_journal.c kernel/storage/blockdev.c -o /tmp/test_storage_journal
          /tmp/test_storage_journal
      - name: Network integrity audit
        id: network_audit
        continue-on-error: true
        run: python3 scripts/check_network_integrity.py
      - name: Prototype claims audit
        id: prototype_audit
        continue-on-error: true
        run: python3 scripts/check_prototype_claims.py
      - name: ARP regression test
        id: arp_test
        continue-on-error: true
        run: |
          cc -std=c11 -Wall -Wextra -Werror tests/test_arp_validation.c kernel/net/arp.c kernel/net/ethernet.c kernel/net/ipv4.c -o /tmp/test_arp_validation
          /tmp/test_arp_validation
      - name: IPv4 regression test
        id: ipv4_test
        continue-on-error: true
        run: |
          cc -std=c11 -Wall -Wextra -Werror tests/test_ipv4_validation.c kernel/net/ipv4.c -o /tmp/test_ipv4_validation
          /tmp/test_ipv4_validation
      - name: ELF regression test
        id: elf_test
        continue-on-error: true
        run: |
          cc -std=c11 -Wall -Wextra -Werror tests/test_elf_validation.c kernel/exec/elf.c -o /tmp/test_elf_validation
          /tmp/test_elf_validation
      - name: Record individual check statuses
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const checks = {
              storage_safety: '${{ steps.storage_safety.outcome }}',
              partition_test: '${{ steps.partition_test.outcome }}',
              ext2_test: '${{ steps.ext2_test.outcome }}',
              journal_test: '${{ steps.journal_test.outcome }}',
              network_audit: '${{ steps.network_audit.outcome }}',
              prototype_audit: '${{ steps.prototype_audit.outcome }}',
              arp_test: '${{ steps.arp_test.outcome }}',
              ipv4_test: '${{ steps.ipv4_test.outcome }}',
              elf_test: '${{ steps.elf_test.outcome }}'
            };
            for (const [name, outcome] of Object.entries(checks)) {
              const state = outcome === 'success' ? 'success' : outcome === 'failure' ? 'failure' : 'error';
              await github.rest.repos.createCommitStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                sha: context.sha,
                state,
                context: 'phoxtra-diagnostic/' + name,
                description: outcome || 'not reported'
              });
            }
